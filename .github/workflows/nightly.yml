name: nightly

# The tier-2 evals (§16.3): three golden builds on staging, live and cheap,
# with the numbers a regression shows up in written to the job summary before
# anyone complains. Each build is cancelled after it settles, so nothing a
# nightly makes outlives it. The console bearer is a repository secret and the
# orchestrator's URL a repository variable, both staging's. The second job runs
# the Chief of Staff cases on staging and the behaviour judge over them.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tier-2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Credentials
        env:
          ORCHESTRATOR_URL: ${{ vars.ORCHESTRATOR_URL }}
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
        run: |
          missing=
          for name in ORCHESTRATOR_URL ORCHESTRATOR_TOKEN; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing (gh variable set ORCHESTRATOR_URL, gh secret set ORCHESTRATOR_TOKEN)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on a build that never reaches a preview or a question, and on
      # any content gate failure. The table lands in the summary either way.
      - run: pnpm eval --tier 2
        env:
          ORCHESTRATOR_URL: ${{ vars.ORCHESTRATOR_URL }}
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}

  behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Credentials
        env:
          COS_API_URL: ${{ vars.COS_API_URL }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          missing=
          for name in COS_API_URL WORKOS_API_KEY WORKOS_CLIENT_ID WORKOS_COOKIE_PASSWORD OPENROUTER_API_KEY; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing (staging's values: gh variable set COS_API_URL, gh secret set for the rest)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Chief of Staff's cases live on staging, the tier-2 gate over them,
      # and the judge's pass count per rule in the summary. A rule broken in
      # a gated case fails the job; the pending cases show and never do.
      - run: pnpm eval:behaviour
        env:
          COS_API_URL: ${{ vars.COS_API_URL }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
