name: nightly

# The tier-2 evals (§16.3): three golden builds on staging, live and cheap,
# with the numbers a regression shows up in written to the job summary before
# anyone complains. Each build is cancelled after it settles, so nothing a
# nightly makes outlives it. The console bearer is a repository secret and the
# orchestrator's URL a repository variable, both staging's.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tier-2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORCHESTRATOR_URL: ${{ vars.ORCHESTRATOR_URL }}
      ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
    steps:
      - name: Credentials
        run: |
          missing=
          for name in ORCHESTRATOR_URL ORCHESTRATOR_TOKEN; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing (gh variable set ORCHESTRATOR_URL, gh secret set ORCHESTRATOR_TOKEN)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on a build that never reaches a preview or a question, and on
      # any content gate failure. The table lands in the summary either way.
      - run: pnpm eval --tier 2
