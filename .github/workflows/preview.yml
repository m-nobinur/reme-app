name: preview

# A preview environment per pull request: one Neon branch for the data, one
# aliased Worker version per app, and a single comment carrying both URLs.
#
# Nothing here deploys. `wrangler versions upload` creates a version and routes
# no production traffic to it, so a preview cannot take staging down and there
# is no rollback to rehearse. The version is reachable only at its own preview
# URL, and it reads the secrets already on the Worker, which is what lets a
# preview sign in against the WorkOS staging environment without this workflow
# ever holding a WorkOS credential.
#
# Previews live on the account's `beapp.workers.dev` subdomain, because
# Cloudflare issues preview aliases nowhere else; the deployed Workers answer on
# `remeai.co.uk` (ADR-030). Every alias carries the worker name and nothing here
# touches a resource it did not create.
#
# The smoke runs here, against the preview, which is what C6 asked for and what
# was true only after merge until now.
#
# The trigger stays `pull_request` and specifically not `pull_request_target`.
# That is the whole of the fork answer: GitHub withholds repository secrets from
# a workflow triggered by `pull_request` on a fork, so a fork PR gets no
# credentials at all and fails on the Credentials step below rather than handing
# a WorkOS key to code nobody has read. `pull_request_target` would run with
# secrets against a checkout the contributor controls, which is the shape that
# leaks. Adding `WORKOS_API_KEY` to this workflow therefore widens nothing: the
# people who can open a branch PR on this private repository are the people who
# already hold the key.
#
# What changes that: the first outside contributor, or this repository going
# public. From then on a fork PR gets no preview and no smoke, so the gate has
# to be re-run by a maintainer against a reviewed commit rather than granted to
# the fork. Decide that when the first fork PR arrives, not before.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: sparkling-wildflower-04343187
  # `pr-<number>` satisfies the alias rules on its own and will keep doing so: it
  # begins with a lowercase letter, holds only lowercase letters, digits and
  # dashes, and `pr-` plus a seven-digit number plus `-reme-web` is 19 characters
  # against the 63-character DNS label limit.
  PREVIEW_ALIAS: pr-${{ github.event.number }}
  NEON_BRANCH: preview/pr-${{ github.event.number }}

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      web: ${{ steps.urls.outputs.web }}
      api: ${{ steps.urls.outputs.api }}
      orchestrator: ${{ steps.urls.outputs.orchestrator }}
      # The branch name, never its connection string: that string carries a
      # password, and a job output is readable by every later job and by anyone
      # who can read the run. A job that needs the database derives the string
      # from this name and its own NEON_API_KEY.
      neon_branch: ${{ steps.urls.outputs.neon_branch }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      # First, and it fails rather than skips. A preview that quietly does not
      # run is worse than a red job, because the PR then shows no URL and no
      # reason for the absence.
      - name: Credentials
        run: |
          missing=
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEON_API_KEY; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            echo "Set each with: gh secret set <name>"
            echo "The Cloudflare token needs Account > Workers Scripts > Edit"
            echo "and Account > Account Settings > Read, scoped to this account."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Preview URLs
        id: urls
        run: |
          {
            echo "web=https://$PREVIEW_ALIAS-reme-web.beapp.workers.dev"
            echo "api=https://$PREVIEW_ALIAS-reme-api.beapp.workers.dev"
            echo "orchestrator=https://$PREVIEW_ALIAS-reme-orchestrator.beapp.workers.dev"
            echo "neon_branch=$NEON_BRANCH"
          } >> "$GITHUB_OUTPUT"

      # A copy-on-write branch of `main`, so it arrives already carrying the
      # three golden orgs and costs only its own delta against the 0.5 GB the
      # free plan gives the project. Created once per PR and reused on every
      # later push, because a branch recreated on each push would lose whatever
      # the previous run wrote to it.
      #
      # The free plan allows 10 branches per project and `main` is one of them,
      # so nine previews can be open at once. Teardown below is what keeps that
      # true.
      - name: Neon branch
        run: |
          if npx -y neonctl@6.4.0 branches get "$NEON_BRANCH" \
              --project-id "$NEON_PROJECT_ID" -o json >/dev/null 2>&1; then
            echo "reusing $NEON_BRANCH"
          else
            # --no-secrets, because the default output of a create prints the
            # branch's connection string, password included, into the run log.
            npx -y neonctl@6.4.0 branches create --project-id "$NEON_PROJECT_ID" \
              --name "$NEON_BRANCH" --parent main --no-secrets
          fi

      # What this proves that the `database` job in ci.yml cannot: the PR's
      # migrations apply to Neon 17.11 over rows that already exist, rather than
      # to an empty Postgres container. `pnpm db:migrate` refuses a `-pooler`
      # host itself, so the direct endpoint is asked for and the refusal stays
      # where it is rather than being restated here.
      - name: Migrations apply to a copy of staging
        run: |
          url=$(npx -y neonctl@6.4.0 connection-string "$NEON_BRANCH" \
            --project-id "$NEON_PROJECT_ID" --role-name neondb_owner)
          case "$url" in
            postgresql://*) ;;
            *) echo "::error::neonctl did not answer with a connection string"; exit 1 ;;
          esac
          DATABASE_URL="$url" pnpm db:migrate

      # `reme-api` binds the staging Hyperdrive config, so this preview reads
      # staging data rather than the branch above. Pointing it at the branch
      # needs a Hyperdrive config per PR, and the free plan allows ten per
      # account. Its ORCHESTRATOR binding reaches the deployed staging
      # orchestrator, not this PR's upload: a binding names a Worker, and
      # nothing sends a version override. The web preview below reads this
      # version through `REME_API_URL`.
      - name: Upload the api version
        run: >
          pnpm --filter api exec wrangler versions upload
          --preview-alias "$PREVIEW_ALIAS"
          --message "pull request ${{ github.event.number }}, ${{ github.sha }}"

      # Built by Vite first, because flue generates the entry and merges the
      # Durable Object bindings into the config wrangler reads. Same staging
      # Hyperdrive as the api, for the same reason.
      - run: pnpm --filter orchestrator build

      - name: Upload the orchestrator version
        run: >
          pnpm --filter orchestrator exec wrangler versions upload
          --config dist/reme_orchestrator/wrangler.json
          --preview-alias "$PREVIEW_ALIAS"
          --message "pull request ${{ github.event.number }}, ${{ github.sha }}"

      - run: pnpm --filter web build

      # `--var` overrides the committed `REME_API_URL`, so the preview web
      # reads this PR's api rather than staging's, and the committed
      # `WORKOS_REDIRECT_URI`, which names the staging hostname. A deployed
      # `reme-web` without a redirect URI that matches its own hostname answers
      # 500 on every route, the public page included, because the AuthKit
      # middleware validates config per request.
      #
      # WorkOS honours this hostname because the staging environment carries the
      # wildcard `https://*-reme-web.beapp.workers.dev/api/auth/callback`, added
      # by `pnpm workos:config staging`. The wildcard matches one subdomain label
      # and ends in `-reme-web`, so it covers every alias of this Worker and no
      # other host on the shared subdomain.
      - name: Upload the web version
        run: >
          pnpm --filter web exec wrangler versions upload
          --config dist/server/wrangler.json
          --preview-alias "$PREVIEW_ALIAS"
          --var "WORKOS_REDIRECT_URI:${{ steps.urls.outputs.web }}/api/auth/callback"
          --var "REME_API_URL:${{ steps.urls.outputs.api }}"
          --message "pull request ${{ github.event.number }}, ${{ github.sha }}"

      # One comment, edited in place on every push, rather than a new one per
      # run. `gh` is already on the runner, so this needs no action and no
      # dependency.
      - name: Comment the URLs
        env:
          GH_TOKEN: ${{ github.token }}
          WEB: ${{ steps.urls.outputs.web }}
          API: ${{ steps.urls.outputs.api }}
          ORCHESTRATOR: ${{ steps.urls.outputs.orchestrator }}
        run: |
          gh pr comment "${{ github.event.number }}" --edit-last --create-if-none --body "$(
            cat <<EOF
          ### Preview

          Owner app: $WEB
          API: $API
          Orchestrator: $ORCHESTRATOR

          Sign-in runs against the WorkOS staging environment on this hostname.
          Both are uploaded versions rather than deployments, so no production
          traffic reaches them and staging is untouched.

          \`reme-api\` reads the staging database. The Neon branch
          \`$NEON_BRANCH\` belongs to this pull request and is what the
          migrations were applied to.

          Commit ${{ github.sha }}.
          EOF
          )"

      # After the comment, so a red smoke still leaves the URL on the PR to look
      # at. Only chromium: this suite drives one browser and installing three
      # costs the job a minute it does not get back.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      # The owner path against this PR's own preview. Ten tests: a real sign-in
      # through the form on the preview hostname, which the wildcard redirect URI
      # exists for, then the dashboard, the staff directory, the chat replay, the
      # approvals inbox and four page-grain axe scans.
      #
      # It creates one throwaway WorkOS user per run on a per-run address and
      # asserts its own deletion, so two open pull requests running at once do
      # not collide: the addresses differ, the sign-in rate limiter is keyed on
      # the address, and the reaper only removes accounts older than an hour.
      # One spec also makes a probe org, unique to the run, and clears it with
      # `pnpm probe:clear`, which needs the job's Neon and Cloudflare secrets and
      # the public staging client id below. Everything else is a read, which is
      # what makes it safe against the staging database two previews share.
      #
      # `WORKOS_API_KEY` is scoped to this step rather than the job, so it is not
      # in the environment of the build, the migration or the uploads. It fails
      # rather than skips: a gate that quietly does not run is the defect this
      # step exists to close.
      - name: Smoke
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          E2E_BASE_URL: ${{ steps.urls.outputs.web }}
          WORKOS_CLIENT_ID: client_01M0WWHM5TQAA6MDR2W910XA75
        run: |
          if [ -z "${WORKOS_API_KEY:-}" ]; then
            echo "::error::missing repository secret WORKOS_API_KEY, so the smoke could not sign in"
            echo "Set it from the staging environment: gh secret set WORKOS_API_KEY"
            exit 1
          fi
          pnpm e2e

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      ARMED: ${{ vars.PREVIEW_TEARDOWN }}
    steps:
      # Cloudflare needs no teardown. An uploaded version is not deployed, so it
      # costs nothing and serves no traffic, and Cloudflare retains the 1000
      # most recent aliases and drops the least recent by itself.
      #
      # Neon does. Nine preview branches fit alongside `main` on the free plan,
      # so a preview that never tears down is what eventually refuses to create
      # the tenth.
      #
      # Deleting a Neon branch is not a decision this workflow gets to make on
      # its own, so it is armed by a repository variable and prints what it would
      # delete until then:
      #
      #   gh variable set PREVIEW_TEARDOWN --body on
      - name: Delete the Neon branch
        run: |
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error::missing repository secret NEON_API_KEY"
            exit 1
          fi
          # A list rather than a `branches get`, so that a rejected credential
          # fails here instead of reading as "no branch, nothing to delete".
          # That distinction is the whole value of this step: teardown that
          # silently stops running fills the branch cap without saying so.
          if ! branches=$(npx -y neonctl@6.4.0 branches list \
              --project-id "$NEON_PROJECT_ID" -o json); then
            echo "::error::could not list the branches of $NEON_PROJECT_ID"
            exit 1
          fi
          if ! printf '%s' "$branches" | grep -qF "\"name\": \"$NEON_BRANCH\""; then
            echo "no branch $NEON_BRANCH, nothing to delete"
            exit 0
          fi
          if [ "${ARMED:-}" != "on" ]; then
            echo "PREVIEW_TEARDOWN is not \"on\", so nothing was deleted."
            echo "Would delete Neon branch $NEON_BRANCH in $NEON_PROJECT_ID."
            echo "Arm it with: gh variable set PREVIEW_TEARDOWN --body on"
            exit 0
          fi
          npx -y neonctl@6.4.0 branches delete "$NEON_BRANCH" \
            --project-id "$NEON_PROJECT_ID"
