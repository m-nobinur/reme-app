name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo remote cache. Both are unset until the owner adds them, and turbo falls
  # back to the filesystem cache below when they are empty. They are repo secrets
  # rather than environment secrets because environments need a paid plan on a
  # private repo, so `staging` and `prod` are deferred.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # `turbo --affected` diffs against main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm typecheck:ci

      - run: pnpm lint:ci --reporter=github

      # api and orchestrator run once, with their database, in `database`.
      - run: pnpm test:ci

      # The ui Playwright suite runs here, not in pre-push, and only when the
      # change reaches packages/ui, so other PRs skip the browser install too.
      # No main to diff against (the local gate's single-branch clone) runs it.
      - run: |
          affected=$(pnpm exec turbo test --affected --filter=@workspace/ui --dry=json | jq '[.tasks[] | select(.taskId == "@workspace/ui#test")] | length' || true)
          if [ "${affected:-1}" != 0 ]; then
            pnpm --filter @workspace/ui exec playwright install --with-deps chromium
            pnpm exec turbo test --filter=@workspace/ui
          fi

      # Tier 1 in replay, per the eng guide's suite table: every recorded
      # fixture replays twice to the hash it is pinned to, since an eval scored
      # against a context that drifts between runs scores noise, and then the
      # tier-1 scenarios score the recordings (evals/README.md lists them). It
      # also refuses an empty `evals/fixtures`.
      - run: pnpm eval --tier 1

      # Bundles the worker and gzips it. Needs no Cloudflare credentials: the
      # dry run never talks to the API.
      - run: pnpm size

      # The whole of the credential boundary since ADR-026 put WORKOS_API_KEY in
      # both Workers: the key is a server-side secret and reaches no client
      # bundle. Scans the built dist/client rather than the source, because what
      # a browser downloads is the only thing the property is about.
      - run: pnpm check:secrets

  # Migrations and the tenancy gate get their own job with a real Postgres,
  # because the thing worth knowing about either is what the database does, not
  # what the code intends. A service container needs no secret, so this is green
  # on a fork PR exactly as it is on ours.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Postgres 17 to match the Neon compute (17.11), not the pg18 in
        # docker-compose.yml. This job earns its place by failing on what Neon
        # would reject.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: reme
          POSTGRES_DB: reme
          # No password at all, rather than a fake one written into the repo:
          # the database lives inside this job and is reachable from nowhere else.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reme -d reme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://reme@localhost:5432/reme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Schema and migrations agree
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::schema.ts was edited without generating a migration."
            echo "Run: pnpm db:generate --name <what_it_does>"
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      - run: pnpm --filter @workspace/db db:check

      # A fresh database.
      - run: pnpm db:migrate

      # The golden orgs are the rows. They cover every table, so a migration is
      # proven against a database holding the fixture set the rest of the repo
      # uses rather than against a probe row written only for this step.
      - name: Apply again, over rows
        run: |
          pnpm seed
          pnpm db:migrate

      # The seed writes as the migrator, which holds BYPASSRLS, so a row it
      # wrote is not yet proof of anything. This reads the seeded rows back
      # through `withOrg` and asserts a second run writes nothing.
      - name: Seed round trip
        run: pnpm test:seed

      # Blocking: a red run blocks the merge button. Not unremovable, though,
      # and the README says so plainly rather than leaving it implied. This is
      # one `run:` line any PR can delete, and branch protection, which is what
      # would make it binding, needs a paid plan on a private repo.
      #
      # It reads the catalog rather than a list, so a relation that arrives
      # without a policy fails here rather than in production, and it now ends
      # by driving the same denial through the authenticated API in
      # `apps/api/tenancy`, one line above where the two halves in packages/db
      # stop. Two things it does not prove. The service container's `reme` user is a superuser, so
      # the Neon-specific fact the design rests on, that `neondb_owner` holds
      # `rolbypassrls`, is never exercised here. And the pooler measurement
      # inside the suite skips: there is no DATABASE_URL_POOLED and this
      # container has no pooler in front of it. Everything else runs.
      - name: Tenancy gate
        run: pnpm test:tenancy

      # `apps/api` reaches the database through a Hyperdrive binding, so its
      # suite runs here, where a claim about the tenant path can be checked
      # against one, and not in the unit job too (nor does orchestrator's).
      # It reads the seeded rows written two steps above, which is what makes
      # "an absent org sees zero" evidence rather than an empty database.
      - name: The API reaches the database through the tenant path
        run: pnpm --filter api test

      # The §8.4 properties: no transition without an event, cancel from every
      # non-terminal state, stale versions refused, one writer per site. They
      # live in constraints and transactions, so only a database can run them.
      - name: The assignment state machine holds
        run: pnpm --filter orchestrator test
