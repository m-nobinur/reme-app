# Offline Postgres for NEON_OFFLINE=1. Neon is the default path, so nothing
# here is required to run the stack. `pnpm bootstrap` starts it when
# NEON_OFFLINE=1 is set; `docker compose down -v` throws the data away.
services:
  postgres:
    # Pinned to 17 to match Neon, which serves 17.11. Local, CI and production
    # ran three configurations before this, two of them agreeing.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: reme
      POSTGRES_PASSWORD: reme
      POSTGRES_DB: reme
    ports:
      - "5432:5432"
    volumes:
      # 17 keeps the cluster in .../data, unlike 18, which puts it in a version
      # subdirectory and needs the mount one level up. Moving the pin moves this.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reme -d reme"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
