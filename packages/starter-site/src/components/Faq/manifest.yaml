component: Faq
path: src/components/Faq/Faq.astro
summary: Questions and answers, each one a native disclosure that needs no script.
props:
  - name: variant
    type: '"split" | "stacked"'
    required: false
    description: split puts the heading beside the questions, stacked above them.
  - name: items
    type: "{ question: string; answer: string }[]"
    required: false
    description: The questions, where a page has its own; empty is the site's FAQ.
  - name: heading
    type: string
    required: false
    description: The h2, where a page has its own; empty is the faqHeading slot's default.
  - name: eyebrow
    type: string
    required: false
    description: The short label above the h2; empty is the faqEyebrow slot's default.
  - name: intro
    type: string
    required: false
    description: One or two sentences under the h2; empty is the faqIntro slot's default.
constraints:
  - Shows the faq block of its section in the page's document (on a site with no
    documents yet, faq1Question to faq8Answer); an entry needs both halves to
    render. Six to eight when the facts answer that many.
  - A page that shows it passes faqPage() to Base's jsonLd, so the FAQPage data
    matches the questions on the page.
  - split sets the heading beside the questions, stacked above them in a narrow
    column. The eyebrow is site.faqEyebrow; site.faqIntro and a site.faqLink to
    the contact page sit under the heading.
examples:
  - "<Faq />"
  - '<Faq variant="split" />'
  - '<Faq variant="stacked" />'
forbidden:
  - an answer stating a price, hour or guarantee no fact carries
  - FAQPage data on a page that does not show the questions
source: generated
