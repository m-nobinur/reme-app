component: TrustStrip
path: src/components/TrustStrip/TrustStrip.astro
summary: A band under the home hero with the business's figures and up to three
  proof points.
props:
  - name: variant
    type: '"icons" | "phrases"'
    required: false
    description: Kept so a stored plan that says "phrases" still builds; both draw
      the icon columns.
constraints:
  - Figures are composed fields (statYearsValue, statClientsValue,
    statRatingValue), each a number business.proof states; one with no value
    does not render.
  - trust1 to trust3 restate business.proof in under six words each, and stay
    empty without it.
  - Renders nothing when there is no proof and fewer than two plain facts.
  - Sets them in up to four columns split by hairlines (2 by 2 on a phone), each
    with the icon its words call for. With fewer than four, plain facts the site
    already states (area, hours, quote link, service count) fill the row.
examples:
  - "<TrustStrip />"
  - '<TrustStrip variant="icons" />'
forbidden:
  - a figure or point business.proof does not state
source: generated
