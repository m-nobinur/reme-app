component: TrustStrip
path: src/components/TrustStrip/TrustStrip.astro
summary: A band under the home hero with the business's figures and up to three
  proof points.
props:
  - name: variant
    type: '"icons" | "phrases"'
    required: false
    description: icons in columns split by hairlines, phrases in one tracked line.
constraints:
  - Figures are composed fields (statYearsValue, statClientsValue,
    statRatingValue), each a number business.proof states; one with no value
    does not render.
  - trust1 to trust3 restate business.proof in under six words each, and stay
    empty without it.
  - Renders nothing when there are no figures and no points.
  - icons sets them in columns split by hairlines, each with the icon its words
    call for in a soft circle; phrases sets them in one uppercase line with dots
    between.
examples:
  - "<TrustStrip />"
  - '<TrustStrip variant="icons" />'
  - '<TrustStrip variant="phrases" />'
forbidden:
  - a figure or point business.proof does not state
source: generated
