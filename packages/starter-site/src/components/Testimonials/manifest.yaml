component: Testimonials
path: src/components/Testimonials/Testimonials.astro
summary: Reviews quoted from the facts, with the reviewer's name.
props:
  - name: variant
    type: '"featured" | "wall"'
    required: false
    description: featured sets the first review larger on a tint, wall sets them evenly.
  - name: eyebrow
    type: string
    required: false
    description: The short label above the h2; empty is the testimonialsEyebrow
      slot's default.
  - name: heading
    type: string
    required: false
    description: The h2; empty is the testimonialsHeading slot's default.
constraints:
  - Quote and author are fact fields from the testimonials.review_1 and
    testimonials.review_2 facts, reviews the owner confirmed the customer agreed
    to have quoted. With neither fact the section is left out. A quote and a
    name are rendered as the fact gives them, unedited and untrimmed.
  - featured sets the first review larger on the tint; wall sets them evenly.
    The eyebrow is site.testimonialsEyebrow.
examples:
  - "<Testimonials />"
  - '<Testimonials variant="featured" />'
  - '<Testimonials variant="wall" />'
forbidden:
  - a review written here
  - editing or shortening a quote
source: generated
