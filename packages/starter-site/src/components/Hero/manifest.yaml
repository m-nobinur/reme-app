component: Hero
path: src/components/Hero/Hero.astro
summary: The page's h1 with an optional lede and action links as children.
props:
  - name: heading
    type: string
    required: true
    description: The page's h1, read from a site field.
  - name: lede
    type: string
    required: false
    description: One sentence under the heading, read from a site field.
  - name: eyebrow
    type: string
    required: false
    description: A short line above the heading, such as the industry, from a site field.
  - name: variant
    type: '"split" | "centered" | "compact"'
    required: false
    description: split for the home page, compact for a page header, centered otherwise.
constraints:
  - One per page, first inside the layout.
  - Children are ActionLink elements only.
  - split for the home page, compact for a page under it, centered otherwise.
  - Renders nothing when the heading, the lede and the actions are all empty.
  - eyebrow is for the home page, with site.industry.
examples:
  - "<Hero heading={site.servicesHeading} lede={site.servicesIntro}
    variant=\"compact\" />"
forbidden:
  - a second Hero on a page
  - literal text in heading or lede
source: generated
