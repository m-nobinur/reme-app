component: PriceCard
path: src/components/PriceCard/PriceCard.astro
summary: One priced service, its name and its price as the fact states it.
props:
  - name: name
    type: string
    required: true
    description: The service's name, read from a site field.
  - name: price
    type: string
    required: true
    description: A pricing fact's field as the site config renders it.
constraints:
  - Renders nothing unless both name and price are set.
examples:
  - "<PriceCard name={site.standardCleanName} price={site.standardCleanHourly}
    />"
forbidden:
