component: QuoteForm
path: src/components/QuoteForm/QuoteForm.astro
summary: The quote request form, its fields read from quoteForm in the site config.
props: []
constraints:
  - Reads quoteForm and the site strings it names; tailor the request by editing
    quoteForm, never this file. Each field is name, type (text, email, tel,
    date, number, select or textarea), label, required, and optionally hint,
    options and autocomplete. label, hint and every option are keys of site,
    each with a composed field.
  - Keep name, email and a details textarea. Ask what the business needs to
    price the job, e.g. pickup, drop-off, date and passengers for a chauffeur
    firm, or the kind of matter for a law firm.
  - A select's options are usually service1Name to service3Name; a select with
    no options set renders as a text input.
  - Sends to quoteFormAction when set, else by email to site.email; renders
    nothing with neither. Leave quoteFormAction empty until the platform gives
    an endpoint.
  - On the quote page, after its Hero.
examples:
  - "<QuoteForm />"
forbidden:
  - a price, a range or a promise of how soon a reply comes
  - a field asking for payment or card details
  - a script or a third-party form service
source: generated
